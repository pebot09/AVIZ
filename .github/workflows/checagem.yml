name: Checagem

# Roda testes e build em todo PR (e em push nas outras branches de trabalho),
# sem publicar nada e sem acesso aos segredos do Cloudflare.
on:
  pull_request:
  push:
    branches-ignore:
      - main # a main já roda os testes no próprio deploy
      - claude/app-commercial-strategy-3rwewq # esta já roda os testes no deploy

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    # O nome do job vira o nome da checagem no GitHub. A regra da main exige
    # uma checagem chamada "Checagem"; sem este nome, ela se chamaria "testes"
    # e o merge ficaria esperando para sempre.
    name: Checagem
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o app
        run: npm run build
