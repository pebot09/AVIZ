name: Checagem

# Roda testes e build em todo PR (e em push nas branches de trabalho), sem
# publicar nada e sem acesso aos segredos do Cloudflare.
on:
  pull_request:
  push:
    branches-ignore:
      - main # a main já roda os testes no próprio deploy

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o app
        run: npm run build
