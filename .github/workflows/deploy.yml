name: Deploy no Cloudflare

# Produção só sai da branch main. O código chega na main por PR revisado
# (o workflow "Checagem" roda os testes no PR antes). Branches de trabalho
# nunca publicam.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # permite disparar o deploy na mão pela aba Actions (só vale na main)

# Um deploy de cada vez; um novo não cancela o que já está no meio.
concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  deploy:
    # Barra o disparo manual a partir de outra branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Ambiente "production" no GitHub: dá para exigir aprovação antes de publicar
    # em Settings → Environments → production.
    environment: production
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o app
        run: npm run build

      - name: Publicar no Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
