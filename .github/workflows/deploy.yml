name: Deploy no Cloudflare

# Push publica direto. Todo push na branch de trabalho (ou na main) sobe a
# versão nova sozinho — sem PR, sem aprovar nada. Os testes rodam aqui mesmo
# antes de publicar: se quebrarem, nada vai pro ar (mas ninguém precisa revisar).
on:
  push:
    branches:
      - main
      - claude/app-commercial-strategy-3rwewq
  workflow_dispatch: {} # permite disparar o deploy na mão pela aba Actions

# Um deploy de cada vez; um novo não cancela o que já está no meio.
concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o app
        run: npm run build

      - name: Publicar no Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
