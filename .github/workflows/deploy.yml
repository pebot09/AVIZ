name: Deploy no Cloudflare

# Produção sai SÓ da main: todo push na main publica sozinho. Nenhuma outra
# branch publica. Os testes rodam antes; se algum falhar, o job para ali e
# nada vai pro ar (cada passo só roda se o anterior passou).
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # permite disparar o deploy na mão pela aba Actions

# Um deploy de cada vez; um novo não cancela o que já está no meio.
concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  deploy:
    # Trava extra: mesmo disparado na mão (aba Actions) noutra branch, não publica.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o app
        run: npm run build

      - name: Publicar no Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
